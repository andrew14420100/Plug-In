name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Dati personali e segreti
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bin/check-public-safety.sh

  php-quality:
    name: PHP — PHPCS, PHPStan, unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: vendor/bin/phpunit -c phpunit-unit.xml.dist

  php-integration:
    name: Integrazione PHP ${{ matrix.php }} / WP ${{ matrix.wp }} / ${{ matrix.db }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        wp: [ '6.9', '7.0', 'latest' ]
        db: [ 'mysql:8.0' ]
        experimental: [ false ]
        include:
          - php: '8.3'
            wp: 'latest'
            db: 'mariadb:10.11'
            experimental: false
          - php: '8.4'
            wp: 'nightly'
            db: 'mysql:8.0'
            experimental: true
    services:
      database:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot || healthcheck.sh --connect"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, mbstring, intl, sodium, zip
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Installa WordPress e test suite
        env:
          WP_TESTS_DIR: ${{ runner.temp }}/wordpress-tests-lib
          WP_CORE_DIR: ${{ runner.temp }}/wordpress
        run: bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} true
      - name: PHPUnit (integrazione, ordine casuale)
        env:
          WP_TESTS_DIR: ${{ runner.temp }}/wordpress-tests-lib
        run: vendor/bin/phpunit -c phpunit-integration.xml.dist --order-by=random

  js:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run typecheck
      - run: npm run test:js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: assets-dist
          path: plugin/bracelli-club/assets/dist
          if-no-files-found: error

  package:
    name: ZIP, ciclo di vita, Plugin Check, E2E
    runs-on: ubuntu-24.04
    needs: [ js ]
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assets-dist
          path: plugin/bracelli-club/assets/dist
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, mbstring, intl, sodium, zip
          tools: wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Costruisci lo ZIP
        run: bin/build-zip.sh
      - name: Apache con mod_php
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2 libapache2-mod-php
      - name: Sito di prova dallo ZIP
        env:
          E2E_DB_USER: root
          E2E_DB_PASS: root
          E2E_DB_HOST: 127.0.0.1:3306
        run: |
          sudo -E env "PATH=$PATH" bin/e2e-setup.sh
      - name: Ciclo di vita (attiva, disattiva, disinstalla con e senza dati)
        run: sudo -E env "PATH=$PATH" bin/lifecycle-check.sh
      - name: Reinstalla per gli E2E
        env:
          E2E_DB_USER: root
          E2E_DB_PASS: root
          E2E_DB_HOST: 127.0.0.1:3306
        run: sudo -E env "PATH=$PATH" bin/e2e-setup.sh
      - name: Plugin Check
        run: |
          sudo wp --path=/tmp/bracelli-e2e --allow-root plugin install plugin-check --activate --quiet
          # Ignorati SOLO i codici attesi e documentati: licenza non ancora decisa dal proprietario,
          # readme in inglese (richiesto solo dalla directory WordPress.org, non usata: Q158),
          # load_plugin_textdomain (necessario perché il plugin non è ospitato su WordPress.org).
          sudo wp --path=/tmp/bracelli-e2e --allow-root plugin check bracelli-club \
            --ignore-codes=plugin_header_no_license,no_license,readme_short_description_non_official_language,readme_description_non_official_language,PluginCheck.CodeAnalysis.DiscouragedFunctions.load_plugin_textdomainFound \
            --format=table | tee plugin-check.txt
          if grep -q "ERROR" plugin-check.txt; then exit 1; fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test end-to-end
        env:
          E2E_SHOTS_DIR: ${{ runner.temp }}/screenshots
        run: npm run test:e2e
      - name: Nessun avviso PHP durante i test
        run: |
          LOG=/tmp/bracelli-e2e/wp-content/debug.log
          if [ -s "$LOG" ]; then
            # Gli avvisi interni di WP-CLI (librerie dentro il suo phar) non riguardano il plugin:
            # qualsiasi altra riga, compresi gli avvisi del plugin, fa fallire il controllo.
            grep -v 'in phar:///usr/local/bin/wp-cli/' "$LOG" > /tmp/plugin-notices.log || true
            if [ -s /tmp/plugin-notices.log ]; then cat /tmp/plugin-notices.log; exit 1; fi
            echo "Solo avvisi interni di WP-CLI ($(wc -l < "$LOG") righe), ignorati."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-e2e
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: bracelli-club-zip
          path: |
            dist/bracelli-club-*.zip
            dist/bracelli-club-*.zip.sha256
          if-no-files-found: error
